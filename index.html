<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assessment Report — Powered by Gradified</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo_g.png">
<link rel="shortcut icon" type="image/png" href="logo_g.png">
<link rel="apple-touch-icon" href="logo_g.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1b2431;
    --ink-soft: #4a5568;
    --paper: #f7f5f0;
    --card: #ffffff;
    --line: #dfdad0;
    --navy: #1f3550;
    --navy-deep: #132234;
    --gold: #b8862f;
    --gold-soft: #f1e3c4;
    --good: #2f6b4f;
    --good-bg: #e7f1ea;
    --mid: #9a6b1c;
    --mid-bg: #faf1de;
    --bad: #9c3b3b;
    --bad-bg: #f7e9e9;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
  }

  /* ---------- Top Action Toolbar ---------- */
  .toolbar-wrapper {
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .toolbar {
    max-width: 920px;
    margin: 0 auto;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .data-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  .btn-primary {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .btn-primary:hover {
    background: var(--navy-deep);
    border-color: var(--navy-deep);
  }
  .btn-accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* ---------- Sheet Container ---------- */
  .sheet {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 48px 80px;
  }

  /* ---------- Header / Branding ---------- */
  .masthead {
    border-bottom: 3px solid var(--navy);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--line);
  }
  .brand-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    height: 42px;
    width: auto;
    object-fit: contain;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .powered-by {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    font-weight: 600;
  }
  .brand-name {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy-deep);
    letter-spacing: -0.01em;
  }
  .masthead-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    color: var(--navy-deep);
  }
  .masthead .meta {
    text-align: right;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .masthead .meta div { margin-bottom: 2px; }

  /* ---------- Score dial + summary ---------- */
  .summary-row {
    display: flex;
    gap: 28px;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .dial-wrap {
    position: relative;
    width: 112px;
    height: 112px;
    flex: 0 0 auto;
  }
  .dial-wrap svg { transform: rotate(-90deg); }
  .dial-pct {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .dial-pct b { font-family: 'Source Serif 4', serif; font-size: 26px; color: var(--navy-deep); }
  .dial-pct span { font-size: 10px; color: var(--ink-soft); letter-spacing: .05em; text-transform: uppercase; }
  .stat-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }
  .stat {
    border-left: 1px solid var(--line);
    padding: 2px 20px;
  }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat .num { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 600; color: var(--navy); }
  .stat .lbl { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }

  /* ---------- Teacher's note ---------- */
  .note {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 4px;
    padding: 20px 24px;
    margin-bottom: 34px;
  }
  .note .eyebrow { margin-bottom: 8px; }
  .note p { margin: 0 0 10px; color: var(--ink); }
  .note p:last-child { margin-bottom: 0; }

  /* ---------- Section headers ---------- */
  .section-title {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .section-title .tally {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  section { margin-bottom: 36px; }

  /* ---------- MCQ grid ---------- */
  .mcq-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .mcq-cell {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 12.5px;
  }
  .mcq-cell .q {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-soft);
    font-size: 11px;
  }
  .mcq-cell .opt { font-weight: 600; margin-top: 2px; }
  .mcq-cell.correct { border-left: 3px solid var(--good); }
  .mcq-cell.correct .opt { color: var(--good); }
  .mcq-cell.wrong { border-left: 3px solid var(--bad); }
  .mcq-cell.wrong .opt { color: var(--bad); }
  .mcq-cell .given { font-size: 11px; color: var(--ink-soft); font-weight: 400; }

  /* ---------- Question cards ---------- */
  .qcard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 22px 20px;
    margin-bottom: 16px;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .qcard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }
  .qcard-head h3 {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
  }
  .qcard-head .qid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 2px;
    display: block;
  }
  .marks-badge {
    flex: 0 0 auto;
    text-align: center;
    padding: 5px 12px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
  }
  .marks-badge.correct { background: var(--good-bg); color: var(--good); }
  .marks-badge.partially_correct { background: var(--mid-bg); color: var(--mid); }
  .marks-badge.incorrect { background: var(--bad-bg); color: var(--bad); }

  .rubric-bar {
    display: flex;
    height: 9px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--line);
    margin-bottom: 6px;
  }
  .rubric-bar .seg { height: 100%; }
  .rubric-bar .seg.hit { background: var(--good); }
  .rubric-bar .seg.miss { background: var(--bad-bg); }
  .rubric-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .rubric-labels span b { color: var(--ink); }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 12px;
  }
  .col-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .col-title.good { color: var(--good); }
  .col-title.bad { color: var(--bad); }
  ul.pt-list { margin: 0; padding-left: 16px; }
  ul.pt-list li { margin-bottom: 3px; }

  .feedback-line {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }

  .student-answer {
    background: #fbfaf7;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    white-space: pre-wrap;
  }
  .student-answer b { color: var(--ink); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }

  details.answer-toggle summary {
    cursor: pointer;
    font-size: 11.5px;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 8px;
    list-style: none;
  }
  details.answer-toggle summary::-webkit-details-marker { display: none; }
  details.answer-toggle summary::before { content: "▸ "; }
  details.answer-toggle[open] summary::before { content: "▾ "; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Modal Dialog ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(19, 34, 52, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    padding: 20px;
  }
  .modal-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    background: #ffffff;
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    transform: translateY(12px);
    transition: transform 0.2s ease;
  }
  .modal-backdrop.active .modal-content {
    transform: translateY(0);
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    color: var(--navy-deep);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { color: var(--navy-deep); }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body p {
    margin: 0 0 12px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .json-textarea {
    width: 100%;
    height: 280px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.45;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fbfaf7;
    color: #1e293b;
    resize: vertical;
  }
  .json-textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .error-banner {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--bad-bg);
    border: 1px solid #f87171;
    border-radius: 6px;
    color: var(--bad);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    white-space: pre-wrap;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #fdfbf7;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  .modal-footer-right {
    display: flex;
    gap: 10px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy-deep);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* ---------- Media Print Support ---------- */
  @media print {
    body {
      background: #fff;
      color: #000;
      font-size: 12.5px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar-wrapper, .modal-backdrop, .toast {
      display: none !important;
    }
    .sheet {
      padding: 0;
      max-width: 100%;
      margin: 0;
    }
    .masthead {
      border-bottom: 3px solid var(--navy) !important;
    }
    .brand-logo {
      height: 42px !important;
      display: block !important;
    }
    .qcard, .note {
      box-shadow: none !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    a[href] {
      color: inherit;
      text-decoration: none;
    }
    section {
      margin-bottom: 22px;
    }
    /* Force expand student answers for printing / PDF export */
    details.answer-toggle {
      display: block !important;
    }
    details.answer-toggle summary {
      display: block !important;
      font-weight: 600;
      margin-bottom: 4px;
    }
    details.answer-toggle summary::before {
      content: "▾ " !important;
    }
    details.answer-toggle .student-answer {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
    }
  }
</style>
</head>
<body>

<!-- Top Navigation / Action Bar -->
<div class="toolbar-wrapper">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="data-status-tag" id="statusTag">
        <span class="status-dot"></span>
        <span id="statusText">Sample Evaluation Data</span>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-primary" onclick="window.print()">
        <span>🖨️ Print / Save as PDF</span>
      </button>
    </div>
  </div>
</div>

<!-- Hidden File Input -->
<input type="file" id="fileInput" accept=".json,application/json,.txt" style="display:none;" onchange="handleFileUpload(event)">

<!-- Main Sheet Container -->
<div class="sheet" id="sheet">
  <!-- Rendered dynamically by JavaScript -->
</div>

<!-- Paste JSON Modal -->
<div class="modal-backdrop" id="jsonModal" onclick="handleModalBackdropClick(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Paste Evaluation JSON Data</h3>
      <button class="modal-close" onclick="closeJsonModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>Paste evaluation report JSON or JavaScript object below to render report view for any student/user. You can also drag and drop a <code>.json</code> file into this box.</p>
      <textarea id="jsonTextArea" class="json-textarea" placeholder="Paste your REPORT_DATA JSON object here... (e.g. { summary: {...}, mcqResults: [...], ... })"></textarea>
      <div id="jsonError" class="error-banner"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="loadSampleIntoModal()">Load Sample JSON</button>
      <div class="modal-footer-right">
        <button class="btn" onclick="closeJsonModal()">Cancel</button>
        <button class="btn btn-accent" onclick="applyJsonFromModal()">Render Report</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Feedback -->
<div class="toast" id="toast">Report updated successfully!</div>

      "10": "Longitudes are important for calculating time because Earth takes around on its axis and moves 18 degrees in one hour. So every 1 degree of longitude change means a minute difference in time. Places in East see Sun early. So their time is ahead, and places in West are behind.",
      "11": "Rotation causes day and night because earth is round like a sphere and it spins from west to East. At one time, only half part of earth feels the sun stays so that half has daytime. The back side part is in shadow so it has nighttime. As earth keeps spinning, day changes into night continuously.",
      "17": "Manuscripts are old historical books that were written by hands on special leaves like palm leaves on back of tree. Because thousands of years ago there were no computers or painting press.",
      "18": "Historians are actually investigators of past. They are scientists or experts who read old broken scripts, value and ancient sources to write down the story of what happened before us.",
      "19": "Civilization is an advanced stage of human society where people have nomadic life and form well-planned cities with advanced culture, trading systems, script for writing, and common rules for living.",
      "20": "Historical sources are highly important because history cannot be written by imagination. Sources give solid proof. If we find Harappan pots on Roman coins, it proves that people lived there and did trading. Sources are like eyes for studying past events.",
      "21": "\"India; that is Bharat\" means our country has two official names in our daily book. India name comes from the Sindhu driver which Ganes called Indus. Bharat name is very old traditional name which comes from the Rigveda tribe called Bharatas who lived in North-West.",
      "22": "Three features of early Indian civilization.\n\n1) They had planned citadels and lower towns made of uniform burnt bricks.\n2) They had grid pattern street systems where roads cut nicely at 90 degree.\n3) They worshipped natural forces and figures like Mother Goddess and Pashupati seal.",
      "23": "Timelines are important because history has thousands of events and without timeline everything will mix up. It helps to track what happened first and what happened next using BC (Before Christ) and AD (Anno Domini). Historical sources like inscription on stones on old monuments are important because they tell us the truth about kings, their dates, and their kingdoms. Without timelines we cannot understand the development of human life, and without sources we have no evidence.",
      "24": "Features of the Indus valley civilisation:\n\nThe Indus valley was a very great bronze age civilization. Main feature are:\n\n- Granaries: They built huge brick stonehouses to keep extra grains safe for emergency.\n- Drainage: Every house was connected to street drains which were covered with stone slabs so dirty water goes outside city safely.\n- Trade: They had dockyard at lotnal and did business with mesopotamia using siels.\n- Weight system: They used accurate weights made of stones for buying and selling things honestly.",
      "30": "Joint family is a traditional Indian family structure where grand parents, uncles, aunts, parents and brother sisters share a common house, property and cook food in the same kitchen.",
      "31": "Gram Sabha is a general assembly meeting of a village where every person who is above 18 years old and has water and can participate to check what work panchayat is doing.",
      "32": "Democracy means a government of our peoples, by our people and for the people. In this system, citizens hold the real power and they select their own leaders through voting system.",
      "33": "Role of family in society.\n\nFamily is the foundational unit. It raises children and teaches them basic moral behavior, language, and culture. If families are stable and teach good values, then the whole society become safe, disciplined, and progressive.",
      "34": "Functions of Gram Panchayat:\n\n- Constructing and maintaining village infrastructure like roads, drainage, and wells.\n- Lurying and collecting local taxes from houses and markets.\n- Executing government schemes related to employment and education in the village.",
      "36": "Family and community are both essential for human life. family fulfils our primary emotional, financial, and physical needs from childhood. Community fulfills our secondary social needs like safety, celebrating festivals together, and running schools or markets. Human beings are social animals and cannot survive alone. While family gives us identity, community gives us a sense of belonging and teaches cooperation.",
      "37": "Panchayati Raj strengthens democracy because it brings grassroot democracy directly to rural areas. instead of ministries in New Delhi making decisions for a small village, the villagers themselves choose their Sarpanch and Panchas. This allows local people to solve local problems like drinking water, village schools, and street lights immediately. It teaches ordinary poor citizens how to vote, questions authority, and handle power, making democracy a real practice at the lowest level."

  str = str.replace(/^REPORT_DATA\s*=\s*/i, '');
  str = str.replace(/;\s*$/, '');

  // Attempt standard JSON parse
  try {
    return JSON.parse(str);
  } catch (e1) {
    // Attempt parsing as JS Object literal (for unquoted keys or single quotes)
    try {
      const relaxedParse = new Function('return (' + str + ')');
      const obj = relaxedParse();
      if (obj && typeof obj === 'object') return obj;
    } catch (e2) {
      throw new Error("Syntax Error in JSON: " + e1.message);
    }
  }
  throw new Error("Invalid JSON or object shape.");
}

  if (data.studentAnswers) {
    if (data.studentAnswers.byQuestionId && typeof data.studentAnswers.byQuestionId === 'object') {
      answersObj = data.studentAnswers.byQuestionId;
    } else if (typeof data.studentAnswers === 'object') {
      answersObj = data.studentAnswers;
    }
  } else if (data.student_answers) {
    answersObj = data.student_answers;
  }

  return {
    summary: data.summary || data.Summary || {},
    mcqResults: data.mcqResults || data.mcq_results || [],
    studentAnswers: { byQuestionId: answersObj },
    subjectiveResults: data.subjectiveResults || data.subjective_results || [],
    subjectiveSummary: data.subjectiveSummary || data.subjective_summary || {},
    overall_feedback: data.overall_feedback || data.overallFeedback || data.feedback || "",
    finalVerification: data.finalVerification || data.final_verification || null
  };
}

/* ============================================================
   SVG & HTML BUILDERS
   ============================================================ */
function scoreDialSVG(pct) {
  const r = 46, c = 2 * Math.PI * r;
  const offset = c - (Math.min(100, Math.max(0, pct)) / 100) * c;
  return `
  <svg width="112" height="112" viewBox="0 0 112 112">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--gold)" stroke-width="10"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function rubricBar(rubric) {
  if (!rubric || !rubric.length) return "";
  const bars = rubric.map(r => {
    const w = (1 / rubric.length * 100).toFixed(2);
    const hit = r.awarded_marks >= r.max_marks;
    return `<div class="seg ${hit ? 'hit' : 'miss'}" style="width:${w}%"></div>`;
  }).join("");
  const labels = rubric.map(r =>
    `<span><b>${r.awarded_marks}/${r.max_marks}</b> ${esc(r.category)}</span>`
  ).join("");
  return `<div class="rubric-bar">${bars}</div><div class="rubric-labels">${labels}</div>`;
}

function mcqCells(mcqResults) {
  return mcqResults.map(m => {
    const ok = m.is_correct;
    return `
    <div class="mcq-cell ${ok ? 'correct' : 'wrong'}">
      <div class="q">Q${esc(m.question_id)}</div>
      <div class="opt">${esc(m.student_option || m.answer || '—')}</div>
      ${ok ? "" : `<div class="given">correct: ${esc(m.correct_option || '—')}</div>`}
    </div>`;
  }).join("");
}

function questionCard(q, studentAnswer) {
  const badgeClass = q.correctness || (q.marks_awarded >= q.max_marks ? 'correct' : q.marks_awarded > 0 ? 'partially_correct' : 'incorrect');
  const strengths = (q.strengths || []).map(s => `<li>${esc(s)}</li>`).join("") || "<li>—</li>";
  const improvements = (q.improvements || []).map(s => `<li>${esc(s)}</li>`).join("") || "<li>—</li>";
  return `
  <div class="qcard">
    <div class="qcard-head">
      <div>
        <span class="qid">${esc(q.question_id)}</span>
        <h3>${esc(q.question_text || q.title || 'Question')}</h3>
      </div>
      <div class="marks-badge ${badgeClass}">${q.marks_awarded ?? 0}/${q.max_marks ?? 0} · ${correctnessLabel(q.correctness)}</div>
    </div>

    ${rubricBar(q.rubric_scores)}

    ${studentAnswer ? `
    <details class="answer-toggle" open>
      <summary>Student's Written Answer</summary>
      <div class="student-answer"><b>Student wrote</b>${esc(studentAnswer)}</div>
    </details>` : ""}

    <div class="two-col">
      <div>
        <div class="col-title good">Strengths</div>
        <ul class="pt-list">${strengths}</ul>
      </div>
      <div>
        <div class="col-title bad">To improve</div>
        <ul class="pt-list">${improvements}</ul>
      </div>
    </div>

    ${q.overall_feedback ? `<div class="feedback-line">${esc(q.overall_feedback)}</div>` : ''}
  </div>`;
}

/* ============================================================
   RENDER REPORT FUNCTION
   ============================================================ */
function renderReport(rawReportData) {
  const data = normalizeReportData(rawReportData);
  currentReportData = data;

  const s = data.summary || {};
  const answers = (data.studentAnswers && data.studentAnswers.byQuestionId) || {};
  const mcq = data.mcqResults || [];
  const subs = data.subjectiveResults || [];
  const subSummary = data.subjectiveSummary || {};

  const percentage = s.percentage ?? (s.total_max_marks ? Math.round((s.total_awarded_marks / s.total_max_marks) * 100) : 0);
  const studentMetaText = [
    s.student_name ? `Student: ${esc(s.student_name)}` : null,
    s.subject ? `Subject: ${esc(s.subject)}` : null,
    s.exam_name ? `Exam: ${esc(s.exam_name)}` : null,
    `Total questions: ${s.total_questions ?? (mcq.length + subs.length)}`
  ].filter(Boolean).join(" • ");

  const html = `
    <div class="masthead">
      <div class="masthead-top">
        <div class="brand-container">
          <img src="logo_g.png" alt="Gradified Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('brandFallback').style.display='inline';">
          <span id="brandFallback" style="display:none; font-weight:bold; font-size:20px; color:var(--navy);">[G]</span>
          <div class="brand-text">
            <span class="powered-by">Powered by</span>
            <span class="brand-name">Gradified</span>
          </div>
        </div>
        <div class="meta">
          <div>${studentMetaText}</div>
          <div>Generated for review &amp; sharing</div>
        </div>
      </div>
      <div class="masthead-main">
        <div>
          <div class="eyebrow">Evaluated Answer Sheet</div>
          <h1>Assessment Report</h1>
        </div>
      </div>
    </div>

    <div class="summary-row">
      <div class="dial-wrap">
        ${scoreDialSVG(percentage)}
        <div class="dial-pct"><b>${percentage}%</b><span>Overall</span></div>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="num">${s.total_awarded_marks ?? "—"} / ${s.total_max_marks ?? "—"}</div><div class="lbl">Marks awarded</div></div>
        <div class="stat"><div class="num">${mcq.length}</div><div class="lbl">MCQs attempted</div></div>
        <div class="stat"><div class="num">${subs.length}</div><div class="lbl">Written answers</div></div>
      </div>
    </div>

    ${data.overall_feedback ? `
    <div class="note">
      <div class="eyebrow">Teacher's note</div>
      ${data.overall_feedback.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join("")}
    </div>` : ""}

    ${mcq.length ? `
    <section>
      <div class="section-title">Multiple Choice Questions <span class="tally">${mcq.filter(m => m.is_correct).length}/${mcq.length} correct</span></div>
      <div class="mcq-grid">${mcqCells(mcq)}</div>
    </section>` : ""}

    ${subs.length ? `
    <section>
      <div class="section-title">Written Answers <span class="tally">${subSummary.total_awarded_marks ?? ""}/${subSummary.total_max_marks ?? ""} marks</span></div>
      ${subs.map(q => questionCard(q, answers[q.question_id.replace(/^Q/i, '')] || answers[q.question_id])).join("")}
    </section>` : ""}

    <footer>Report generated automatically from evaluation data • Powered by Gradified</footer>
  `;

  document.getElementById("sheet").innerHTML = html;
}

/* ============================================================
   MODAL & USER INTERACTION LOGIC
   ============================================================ */
function openJsonModal() {
  const modal = document.getElementById("jsonModal");
  const textarea = document.getElementById("jsonTextArea");
  document.getElementById("jsonError").style.display = "none";
  
  if (currentReportData) {
    textarea.value = JSON.stringify(currentReportData, null, 2);
  } else {
    textarea.value = JSON.stringify(DEMO_REPORT_DATA, null, 2);
  }
  
  modal.classList.add("active");
  textarea.focus();
}

function closeJsonModal() {
  document.getElementById("jsonModal").classList.remove("active");
}

function handleModalBackdropClick(e) {
  if (e.target.id === "jsonModal") closeJsonModal();
}

function applyJsonFromModal() {
  const textarea = document.getElementById("jsonTextArea");
  const errBanner = document.getElementById("jsonError");
  errBanner.style.display = "none";

  try {
    const parsed = parseReportJSON(textarea.value);
    renderReport(parsed);
    saveToLocalStorage(parsed);
    updateStatusTag("Custom JSON Loaded");
    closeJsonModal();
    showToast("Report updated successfully!");
  } catch (err) {
    errBanner.textContent = "Error: " + err.message;
    errBanner.style.display = "block";
  }
}

function loadSampleIntoModal() {
  document.getElementById("jsonTextArea").value = JSON.stringify(DEMO_REPORT_DATA, null, 2);
  document.getElementById("jsonError").style.display = "none";
}

function triggerFileInput() {
  document.getElementById("fileInput").click();
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = parseReportJSON(e.target.result);
      renderReport(parsed);
      saveToLocalStorage(parsed);
      updateStatusTag(`File: ${file.name}`);
      showToast(`Loaded ${file.name}!`);
    } catch (err) {
      alert("Could not load file: " + err.message);
    }
  };
  reader.readAsText(file);
}

function resetToDemoData() {
  localStorage.removeItem("GRADIFIED_SAVED_REPORT");
  renderReport(DEMO_REPORT_DATA);
  updateStatusTag("Sample Evaluation Data");
  showToast("Reset to default sample data");
}

function updateStatusTag(text) {
  document.getElementById("statusText").textContent = text;
}

function saveToLocalStorage(data) {
  try {
    localStorage.setItem("GRADIFIED_SAVED_REPORT", JSON.stringify(data));
  } catch (e) {
    console.warn("Could not save to localStorage", e);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem("GRADIFIED_SAVED_REPORT");
    if (saved) {
      const parsed = JSON.parse(saved);
      renderReport(parsed);
      updateStatusTag("Saved Local Report");
      return true;
    }
  } catch (e) {
    console.warn("Could not load from localStorage", e);
  }
  return false;
}

/* ============================================================
   EXTERNAL PROGRAMMATIC LOADING (URL, PostMessage, Window Call)
   ============================================================ */
// Window helper so external scripts/apps can call window.loadReportData(json) directly
window.loadReportData = function(jsonOrObj) {
  try {
    const parsed = typeof jsonOrObj === 'string' ? parseReportJSON(jsonOrObj) : jsonOrObj;
    renderReport(parsed);
    saveToLocalStorage(parsed);
    updateStatusTag("Programmatically Loaded");
    showToast("Report loaded via application!");
  } catch (err) {
    console.error("Failed to load report data:", err);
  }
};

// PostMessage listener so parent window/iframe can send report data
window.addEventListener("message", function(event) {
  if (event.data && (event.data.type === "LOAD_REPORT_DATA" || event.data.REPORT_DATA)) {
    const payload = event.data.REPORT_DATA || event.data.data;
    if (payload) window.loadReportData(payload);
  }
});

// Drag and drop JSON file onto window
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    const file = e.dataTransfer.files[0];
    if (file.name.endsWith(".json") || file.name.endsWith(".txt")) {
      const reader = new FileReader();
      reader.onload = ev => window.loadReportData(ev.target.result);
      reader.readAsText(file);
    }
  }
});

/* ============================================================
   INIT ON PAGE LOAD & PARAMETER PARSING
   ============================================================ */
// Helper to decode Base64 safely (handles Unicode / UTF-8)
function decodeBase64Utf8(str) {
  try {
    const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  } catch (e) {
    return atob(str); // Fallback
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  const hash = window.location.hash ? window.location.hash.substring(1) : "";
  const hashParams = new URLSearchParams(hash);

  const b64Param = urlParams.get("b64") || urlParams.get("base64") || hashParams.get("b64") || hashParams.get("base64");
  const dataParam = urlParams.get("data") || urlParams.get("json") || hashParams.get("data") || hashParams.get("json");
  const fetchUrlParam = urlParams.get("url") || urlParams.get("src") || urlParams.get("fetch") || hashParams.get("url");
  const reportIdParam = urlParams.get("id") || urlParams.get("reportId");
  const tokenParam = urlParams.get("token") || urlParams.get("auth") || urlParams.get("bearer");

  // Helper for fetch headers
  const fetchHeaders = {};
  if (tokenParam) {
    fetchHeaders["Authorization"] = tokenParam.startsWith("Bearer ") ? tokenParam : `Bearer ${tokenParam}`;
  }

  // Option A: Report ID parameter (fetches directly from Gradified API endpoint)
  if (reportIdParam) {
    const apiHost = urlParams.get("apiHost") || "https://api.gradified.in";
    const apiUrl = `${apiHost}/api/v1/report/${encodeURIComponent(reportIdParam)}`;
    updateStatusTag(`Loading Report #${reportIdParam.substring(0,8)}...`);
    fetch(apiUrl, { headers: fetchHeaders })
      .then(res => {
        if (!res.ok) throw new Error("API returned HTTP status " + res.status);
        return res.json();
      })
      .then(data => {
        window.loadReportData(data);
        updateStatusTag(`Report #${reportIdParam.substring(0,8)}`);
        showToast("Report loaded!");
      })
      .catch(err => {
        console.error("Error fetching report ID:", err);
        updateStatusTag("Fetch error");
        alert("Could not load report ID " + reportIdParam + ": " + err.message);
      });
    return;
  }

  // Option B: Remote API fetch URL
  if (fetchUrlParam) {
    updateStatusTag("Fetching report from API...");
    fetch(fetchUrlParam, { headers: fetchHeaders })
      .then(res => {
        if (!res.ok) throw new Error("HTTP status " + res.status);
        return res.json();
      })
      .then(data => {
        window.loadReportData(data);
        showToast("Loaded from URL!");
      })
      .catch(err => {
        console.error("Error fetching report URL:", err);
        updateStatusTag("Fetch error");
        alert("Could not load report from API: " + err.message);
      });
    return;
  }

  // Option A: Base64 string in URL
  if (b64Param) {
    try {
      const decodedJson = decodeBase64Utf8(decodeURIComponent(b64Param));
      window.loadReportData(decodedJson);
      return;
    } catch(e) {
      console.error("Failed to parse Base64 URL param", e);
    }
  }

  // Option B: Plain or URL-encoded JSON in URL
  if (dataParam) {
    try {
      const decoded = decodeURIComponent(dataParam);
      window.loadReportData(decoded);
      return;
    } catch(e) {
      console.error("Failed to parse JSON URL param", e);
    }
  }

  // Option C: Fetch from remote JSON API endpoint
  if (fetchUrlParam) {
    updateStatusTag("Fetching report from API...");
    fetch(fetchUrlParam)
      .then(res => {
        if (!res.ok) throw new Error("HTTP error " + res.status);
        return res.json();
      })
      .then(data => {
        window.loadReportData(data);
        showToast("Loaded from URL!");
      })
      .catch(err => {
        console.error("Error fetching report URL:", err);
        updateStatusTag("Fetch error");
        alert("Could not load report from API: " + err.message);
      });
    return;
  }

  // Option D: Handshake with window.opener (if opened via window.open)
  if (window.opener) {
    try {
      window.opener.postMessage({ type: "REPORT_VIEWER_READY" }, "*");
    } catch(e) {}
  }

  // Auto-expand all student answer details before printing / saving PDF
  window.addEventListener("beforeprint", () => {
    document.querySelectorAll("details.answer-toggle").forEach(el => {
      el.open = true;
    });
  });

  // Fallback: Load from localStorage or Demo Data
  if (!loadFromLocalStorage()) {
    renderReport(DEMO_REPORT_DATA);
  }
});
</script>
