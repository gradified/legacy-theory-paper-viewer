<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mathematics Assessment Report — Powered by Gradified</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../logo_g.png">
<link rel="shortcut icon" type="image/png" href="../logo_g.png">
<link rel="apple-touch-icon" href="../logo_g.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- KaTeX CSS & JS for LaTeX Rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- html2pdf.js for direct PDF export with custom filenames -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    --ink: #1b2431;
    --ink-soft: #4a5568;
    --paper: #f7f5f0;
    --card: #ffffff;
    --line: #dfdad0;
    --navy: #1f3550;
    --navy-deep: #132234;
    --gold: #b8862f;
    --gold-soft: #f1e3c4;
    --good: #2f6b4f;
    --good-bg: #e7f1ea;
    --mid: #9a6b1c;
    --mid-bg: #faf1de;
    --bad: #9c3b3b;
    --bad-bg: #f7e9e9;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  /* ---------- Top Action Toolbar / Navbar ---------- */
  .toolbar-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    transition: all 0.2s ease;
  }
  .toolbar {
    max-width: 880px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .data-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    background: rgba(247, 245, 240, 0.8);
    border: 1px solid var(--line);
    border-radius: 30px;
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    animation: statusPulse 2s infinite ease-in-out;
  }
  @keyframes statusPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.75; }
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    background: var(--navy);
    color: #ffffff;
    border: 1px solid var(--navy-deep);
    box-shadow: 0 2px 6px rgba(31, 53, 80, 0.15);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-print:hover {
    background: var(--navy-deep);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(19, 34, 52, 0.25);
  }
  .btn-print:active {
    transform: translateY(0);
  }
  .btn-print svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  .btn-primary {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .btn-primary:hover {
    background: var(--navy-deep);
    border-color: var(--navy-deep);
  }
  .btn-accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* ---------- Sheet Container ---------- */
  .sheet {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 48px 80px;
  }

  /* ---------- Header / Branding ---------- */
  .masthead {
    border-bottom: 3px solid var(--navy);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--line);
  }
  .brand-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    height: 42px;
    width: auto;
    object-fit: contain;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .powered-by {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    font-weight: 600;
  }
  .brand-name {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy-deep);
    letter-spacing: -0.01em;
  }
  .masthead-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    color: var(--navy-deep);
  }
  .masthead .meta {
    text-align: right;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .masthead .meta div { margin-bottom: 2px; }

  /* ---------- Score dial + summary ---------- */
  .summary-row {
    display: flex;
    gap: 28px;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .dial-wrap {
    position: relative;
    width: 112px;
    height: 112px;
    flex: 0 0 auto;
  }
  .dial-wrap svg { transform: rotate(-90deg); }
  .dial-pct {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .dial-pct b { font-family: 'Source Serif 4', serif; font-size: 26px; color: var(--navy-deep); }
  .dial-pct span { font-size: 10px; color: var(--ink-soft); letter-spacing: .05em; text-transform: uppercase; }
  .stat-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }
  .stat {
    border-left: 1px solid var(--line);
    padding: 2px 20px;
  }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat .num { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 600; color: var(--navy); }
  .stat .lbl { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }

  /* ---------- Teacher's note ---------- */
  .note {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 4px;
    padding: 20px 24px;
    margin-bottom: 34px;
  }
  .note .eyebrow { margin-bottom: 8px; }
  .note p { margin: 0 0 10px; color: var(--ink); }
  .note p:last-child { margin-bottom: 0; }

  /* ---------- Section headers ---------- */
  .section-title {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .section-title .tally {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  section { margin-bottom: 36px; }

  /* ---------- MCQ grid ---------- */
  .mcq-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .mcq-cell {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 12.5px;
  }
  .mcq-cell .q {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-soft);
    font-size: 11px;
  }
  .mcq-cell .opt { font-weight: 600; margin-top: 2px; }
  .mcq-cell.correct { border-left: 3px solid var(--good); }
  .mcq-cell.correct .opt { color: var(--good); }
  .mcq-cell.wrong { border-left: 3px solid var(--bad); }
  .mcq-cell.wrong .opt { color: var(--bad); }
  .mcq-cell .given { font-size: 11px; color: var(--ink-soft); font-weight: 400; }

  /* ---------- Question cards ---------- */
  .qcard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 22px 20px;
    margin-bottom: 16px;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .qcard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }
  .qcard-head h3 {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
    line-height: 1.4;
  }
  .qcard-head .qid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 2px;
    display: block;
  }
  .marks-badge {
    flex: 0 0 auto;
    text-align: center;
    padding: 5px 12px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
  }
  .marks-badge.correct { background: var(--good-bg); color: var(--good); }
  .marks-badge.partially_correct { background: var(--mid-bg); color: var(--mid); }
  .marks-badge.incorrect { background: var(--bad-bg); color: var(--bad); }

  .rubric-bar {
    display: flex;
    height: 9px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--line);
    margin-bottom: 6px;
  }
  .rubric-bar .seg { height: 100%; }
  .rubric-bar .seg.hit { background: var(--good); }
  .rubric-bar .seg.miss { background: var(--bad-bg); }
  .rubric-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .rubric-labels span b { color: var(--ink); }

  /* ---------- Step-by-Step Analysis ---------- */
  .steps-container {
    margin-bottom: 14px;
    background: #fcfbfa;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .steps-container .steps-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
  }
  .step-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .step-row:last-child { margin-bottom: 0; }
  .step-badge {
    font-size: 11px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .step-badge.hit { background: var(--good-bg); color: var(--good); }
  .step-badge.miss { background: var(--bad-bg); color: var(--bad); }
  .step-text { flex: 1; color: var(--ink); }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 12px;
  }
  .col-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .col-title.good { color: var(--good); }
  .col-title.bad { color: var(--bad); }
  ul.pt-list { margin: 0; padding-left: 16px; }
  ul.pt-list li { margin-bottom: 3px; }

  .feedback-line {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }

  .student-answer {
    background: #fbfaf7;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    white-space: pre-wrap;
  }
  .student-answer b { color: var(--ink); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }

  details.answer-toggle summary {
    cursor: pointer;
    font-size: 11.5px;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 8px;
    list-style: none;
  }
  details.answer-toggle summary::-webkit-details-marker { display: none; }
  details.answer-toggle summary::before { content: "▸ "; }
  details.answer-toggle[open] summary::before { content: "▾ "; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Modal Dialog ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(19, 34, 52, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    padding: 20px;
  }
  .modal-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    background: #ffffff;
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    transform: translateY(12px);
    transition: transform 0.2s ease;
  }
  .modal-backdrop.active .modal-content {
    transform: translateY(0);
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    color: var(--navy-deep);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { color: var(--navy-deep); }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body p {
    margin: 0 0 12px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .json-textarea {
    width: 100%;
    height: 280px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.45;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fbfaf7;
    color: #1e293b;
    resize: vertical;
  }
  .json-textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .error-banner {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--bad-bg);
    border: 1px solid #f87171;
    border-radius: 6px;
    color: var(--bad);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    white-space: pre-wrap;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #fdfbf7;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  .modal-footer-right {
    display: flex;
    gap: 10px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy-deep);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* KaTeX Customizations */
  .katex-display { margin: 0.5em 0; }

  /* ---------- Responsive Design ---------- */
  @media (max-width: 768px) {
    .sheet {
      padding: 24px 18px 60px;
    }
    .toolbar {
      padding: 10px 16px;
    }
    .masthead-top {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .masthead .meta {
      text-align: left;
    }
    .masthead-main {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .masthead h1 {
      font-size: 26px;
    }
    .summary-row {
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 24px;
    }
    .stat-grid {
      width: 100%;
    }
    .stat {
      padding: 2px 10px;
      text-align: center;
    }
    .mcq-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .two-col {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .qcard {
      padding: 16px 16px 18px;
    }
    .qcard-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .marks-badge {
      align-self: flex-start;
    }
    .section-title {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .modal-content {
      max-height: 95vh;
    }
    .modal-header, .modal-body, .modal-footer {
      padding: 14px 16px;
    }
    .modal-footer {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .modal-footer-right {
      justify-content: flex-end;
    }
    .toast {
      bottom: 16px;
      right: 16px;
      left: 16px;
      text-align: center;
    }
  }

  @media (max-width: 480px) {
    .sheet {
      padding: 16px 12px 40px;
    }
    .masthead h1 {
      font-size: 22px;
    }
    .mcq-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .stat-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .stat {
      border-left: none;
      border-bottom: 1px solid var(--line);
      padding: 0 0 10px 0;
    }
    .stat:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }
    .toolbar-left, .toolbar-right {
      width: 100%;
      justify-content: center;
    }
    .btn {
      width: 100%;
      justify-content: center;
    }
    .modal-footer-right {
      flex-direction: column;
    }
    .modal-footer-right .btn {
      width: 100%;
    }
  }

  /* ---------- Media Print Support ---------- */
  @media print {
    body {
      background: #fff;
      color: #000;
      font-size: 12.5px;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar-wrapper, .modal-backdrop, .toast {
      display: none !important;
    }
    .sheet {
      padding: 0;
      max-width: 100%;
      margin: 0;
    }
    .masthead {
      border-bottom: 3px solid var(--navy) !important;
    }
    .brand-logo {
      height: 42px !important;
      display: block !important;
    }
    .qcard, .note {
      box-shadow: none !important;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    a[href] {
      color: inherit;
      text-decoration: none;
    }
    section {
      margin-bottom: 22px;

/* State variable */
let currentReportData = null;

/* Helper Utilities */
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function formatMathText(str) {
  if (!str) return "";
  let s = esc(str);

  // Auto-wrap LaTeX math patterns if not already in $...$ or \(...\)
  // Match patterns like \frac{...}{...}, \sqrt{...}, \angle ABC, \triangle ABC, \pi, \pm, \times, \div, etc.
  s = s.replace(/(\\(?:frac|sqrt|angle|triangle|square|degree|pi|cdot|times|div|pm|leq|geq|neq|approx|sum|int|infty)(?:\{[^{}]*\}|\s+[a-zA-Z0-9]+)*)/g, function(match) {
    return `\\(${match}\\)`;
  });

  s = s.replace(/\n/g, '<br>');
  return s;
}

function correctnessLabel(c) {
  return { correct: "Correct", partially_correct: "Partial", incorrect: "Incorrect" }[c] || c;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

function renderAllMath() {
  const sheetEl = document.getElementById("sheet");
  if (!sheetEl) return;
  if (typeof renderMathInElement === "function") {
    try {
      renderMathInElement(sheetEl, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        throwOnError: false
      });
    } catch (e) {
      console.warn("KaTeX rendering warning:", e);
    }
  }
}

/* ============================================================
   JSON PARSING & NORMALIZATION
   ============================================================ */
function parseReportJSON(input) {
  if (!input || !input.trim()) {
    throw new Error("Input string is empty.");
  }
  let str = input.trim();

  str = str.replace(/^(const|let|var)\s+REPORT_DATA\s*=\s*/i, '');
  str = str.replace(/^REPORT_DATA\s*=\s*/i, '');
  str = str.replace(/;\s*$/, '');

  try {
    return JSON.parse(str);
  } catch (e1) {
    try {
      const relaxedParse = new Function('return (' + str + ')');
      const obj = relaxedParse();
      if (obj && typeof obj === 'object') return obj;
    } catch (e2) {
      throw new Error("Syntax Error in JSON: " + e1.message);
    }
  }
  throw new Error("Invalid JSON or object shape.");
}

function normalizeReportData(raw) {
  let data = raw;
  if (typeof data === 'string') {
    data = parseReportJSON(data);
  }
  if (!data || typeof data !== 'object') {
    throw new Error("Data must be a valid JSON object.");
  }

  const summary = data.summary || data.Summary || {};
  const studentObj = data.student || {};

  // Build evaluation lookup map
  const evalMap = {};
  const evalArray = Array.isArray(data.evaluation) ? data.evaluation : [];
  evalArray.forEach(item => {
    if (item && item.question_id !== undefined) {
      const qidKey = String(item.question_id).trim().replace(/^Q/i, '');
      evalMap[qidKey] = item;
      evalMap[String(item.question_id).trim()] = item;
    }
  });

  const studentName = summary.student_name || studentObj.name || studentObj.student_name || "Student Assessment";
  const subject = summary.subject || "Mathematics";
  const examName = summary.exam_name || "Mathematics Evaluation";

  // Normalize MCQs
  let rawMcqs = data.mcqResults || data.mcq_results || [];
  if (!rawMcqs.length && evalArray.length) {
    rawMcqs = evalArray.filter(item => item.answer_type === "mcq" || item.student_option !== undefined || item.correct_option !== undefined);
  }

  const mcqResults = rawMcqs.map(m => {
    const qidStr = String(m.question_id || "").trim();
    const qidKey = qidStr.replace(/^Q/i, '');
    const evalItem = evalMap[qidKey] || evalMap[qidStr] || {};

    const studentOption = m.student_option || evalItem.student_option || m.student_answer || evalItem.student_answer || "";
    const correctOption = m.correct_option || evalItem.correct_option || m.model_answer || evalItem.model_answer || "";
    const isCorrect = m.is_correct !== undefined ? Boolean(m.is_correct) : (m.correctness === "correct" || evalItem.correctness === "correct");

    let cleanStudentOpt = String(studentOption).trim();
    const optMatch = cleanStudentOpt.match(/^\(?([A-Da-d])\)?[\.\:\s]/);
    if (optMatch) {
      cleanStudentOpt = optMatch[1].toUpperCase();
    }

    return {
      question_id: qidStr || evalItem.question_id || "MCQ",
      question_text: evalItem.question_text || m.question_text || "",
      student_option: cleanStudentOpt,
      correct_option: String(correctOption).trim().toUpperCase(),
      is_correct: isCorrect,
      marks_awarded: m.marks_awarded ?? evalItem.marks_awarded ?? (isCorrect ? 1 : 0),
      max_marks: m.max_marks ?? evalItem.max_marks ?? 1
    };
  });

  // Normalize Subjective Results
  let rawSubs = data.subjectiveResults || data.subjective_results || [];
  if (!rawSubs.length && evalArray.length) {
    rawSubs = evalArray.filter(item => item.answer_type !== "mcq" && (item.question_text || item.steps_analysis || item.feedback));
  }

  const subjectiveResults = rawSubs.map(sub => {
    const qidStr = String(sub.question_id || "").trim();
    const qidKey = qidStr.replace(/^Q/i, '');
    const evalItem = evalMap[qidKey] || evalMap[qidStr] || {};

    const questionText = sub.question_text || evalItem.question_text || sub.title || `Question ${qidStr}`;
    const maxMarks = sub.max_marks ?? evalItem.max_marks ?? 1;
    const marksAwarded = sub.marks_awarded ?? evalItem.marks_awarded ?? 0;

    let correctness = sub.correctness || evalItem.correctness;
    if (!correctness) {
      if (marksAwarded >= maxMarks) correctness = "correct";
      else if (marksAwarded > 0) correctness = "partially_correct";
      else correctness = "incorrect";
    }

    let studentAnswer = sub.student_answer || evalItem.student_answer || "";
    if (!studentAnswer && data.studentAnswers) {
      const answersObj = data.studentAnswers.byQuestionId || data.studentAnswers;
      studentAnswer = answersObj[qidKey] || answersObj[qidStr] || "";
    }

    // Build Rubric Scores & Steps
    const steps = sub.steps_analysis || evalItem.steps_analysis || null;
    const criteriaMet = sub.criteria_met || evalItem.criteria_met || [];
    const criteriaMissed = sub.criteria_missed || evalItem.criteria_missed || [];

    let rubricScores = sub.rubric_scores;
    if (!rubricScores) {
      if (Array.isArray(steps) && steps.length) {
        rubricScores = steps.map(s => ({
          category: s.step || "Step",
          max_marks: s.marks || 1,
          awarded_marks: s.is_correct ? (s.marks || 1) : 0
        }));
      } else if (criteriaMet.length || criteriaMissed.length) {
        rubricScores = [
          ...criteriaMet.map(c => ({ category: c.criterion || "Criterion", max_marks: c.marks || 1, awarded_marks: c.marks || 1 })),
          ...criteriaMissed.map(c => ({ category: c.criterion || "Criterion", max_marks: c.marks || 1, awarded_marks: 0 }))
        ];
      }
    }

    // Strengths & Improvements
    let strengths = sub.strengths || [];
    let improvements = sub.improvements || [];
    const feedbackObj = sub.feedback || evalItem.feedback;

    if (typeof feedbackObj === 'object' && feedbackObj !== null) {
      if (feedbackObj.strengths && !strengths.length) {
        strengths = Array.isArray(feedbackObj.strengths) ? feedbackObj.strengths : [feedbackObj.strengths];
      }
      if (feedbackObj.improvements && !improvements.length) {
        improvements = Array.isArray(feedbackObj.improvements) ? feedbackObj.improvements : [feedbackObj.improvements];
      }
    } else if (typeof feedbackObj === 'string' && !strengths.length && !improvements.length) {
      const strFeedback = feedbackObj;
      const strMatch = strFeedback.match(/Strengths:\s*(.*?)\s*\.?\s*Improvements:\s*(.*)/i);
      if (strMatch) {
        if (!strengths.length && strMatch[1]) strengths = [strMatch[1]];
        if (!improvements.length && strMatch[2]) improvements = [strMatch[2]];
      }
    }

    let overallFeedback = sub.overall_feedback || sub.explanation || evalItem.explanation || "";
    if (!overallFeedback && typeof feedbackObj === 'string') {
      overallFeedback = feedbackObj;
    }

    return {
      question_id: qidStr,
      question_text: questionText,
      max_marks: maxMarks,
      marks_awarded: marksAwarded,
      correctness: correctness,
      student_answer: studentAnswer,
      rubric_scores: rubricScores,
      strengths: strengths,
      improvements: improvements,
      overall_feedback: overallFeedback,
      key_points_covered: sub.key_points_covered || evalItem.key_points_covered || [],
      key_points_missing: sub.key_points_missing || evalItem.key_points_missing || [],
      steps_analysis: steps
    };
  });

  const totalQuestions = summary.total_questions || (mcqResults.length + subjectiveResults.length);
  const totalMaxMarks = summary.total_max_marks || (mcqResults.reduce((a, b) => a + b.max_marks, 0) + subjectiveResults.reduce((a, b) => a + b.max_marks, 0));
  const totalAwardedMarks = summary.total_awarded_marks !== undefined ? summary.total_awarded_marks : (mcqResults.reduce((a, b) => a + b.marks_awarded, 0) + subjectiveResults.reduce((a, b) => a + b.marks_awarded, 0));
  const percentage = summary.percentage !== undefined ? summary.percentage : (totalMaxMarks ? Math.round((totalAwardedMarks / totalMaxMarks) * 100 * 100) / 100 : 0);

  return {
    summary: {
      percentage: percentage,
      total_max_marks: totalMaxMarks,
      total_questions: totalQuestions,
      total_awarded_marks: totalAwardedMarks,
      student_name: studentName,
      subject: subject,
      exam_name: examName
    },
    mcqResults: mcqResults,
    subjectiveResults: subjectiveResults,
    subjectiveSummary: data.subjectiveSummary || {
      total_max_marks: subjectiveResults.reduce((a, b) => a + b.max_marks, 0),
      total_awarded_marks: subjectiveResults.reduce((a, b) => a + b.marks_awarded, 0)
    },
    overall_feedback: data.overall_feedback || data.overallFeedback || data.feedback || ""
  };
}

/* ============================================================
   SVG & HTML BUILDERS
   ============================================================ */
function scoreDialSVG(pct) {
  const r = 46, c = 2 * Math.PI * r;
  const offset = c - (Math.min(100, Math.max(0, pct)) / 100) * c;
  return `
  <svg width="112" height="112" viewBox="0 0 112 112">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--gold)" stroke-width="10"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function rubricBar(rubric) {
  if (!rubric || !rubric.length) return "";
  const bars = rubric.map(r => {
    const w = (1 / rubric.length * 100).toFixed(2);
    const hit = r.awarded_marks >= r.max_marks;
    return `<div class="seg ${hit ? 'hit' : 'miss'}" style="width:${w}%"></div>`;
  }).join("");
  const labels = rubric.map(r =>
    `<span><b>${r.awarded_marks}/${r.max_marks}</b> ${formatMathText(r.category)}</span>`
  ).join("");
  return `<div class="rubric-bar">${bars}</div><div class="rubric-labels">${labels}</div>`;
}

function stepsBreakdown(steps) {
  if (!steps || !steps.length) return "";
  const items = steps.map(s => {
    const hit = s.is_correct;
    return `
    <div class="step-row">
      <span class="step-badge ${hit ? 'hit' : 'miss'}">${hit ? '✓ +' + (s.marks || 1) : '✗ 0'}</span>
      <span class="step-text">${formatMathText(s.step)}</span>
    </div>`;
  }).join("");
  return `
  <div class="steps-container">
    <div class="steps-header">Step-by-step scoring</div>
    ${items}
  </div>`;
}

function mcqCells(mcqResults) {
  return mcqResults.map(m => {
    const ok = m.is_correct;
    return `
    <div class="mcq-cell ${ok ? 'correct' : 'wrong'}">
      <div class="q">Q${esc(m.question_id)}</div>
      <div class="opt">${esc(m.student_option || '—')}</div>
      ${ok ? "" : `<div class="given">correct: ${esc(m.correct_option || '—')}</div>`}
    </div>`;
  }).join("");
}

function questionCard(q) {
  const badgeClass = q.correctness || (q.marks_awarded >= q.max_marks ? 'correct' : q.marks_awarded > 0 ? 'partially_correct' : 'incorrect');
  const strengths = (q.strengths || []).map(s => `<li>${formatMathText(s)}</li>`).join("") || "<li>—</li>";
  const improvements = (q.improvements || []).map(s => `<li>${formatMathText(s)}</li>`).join("") || "<li>—</li>";
  
  return `
  <div class="qcard">
    <div class="qcard-head">
      <div>
        <span class="qid">Question ${esc(q.question_id)}</span>
        <h3>${formatMathText(q.question_text)}</h3>
      </div>
      <div class="marks-badge ${badgeClass}">${q.marks_awarded ?? 0}/${q.max_marks ?? 0} · ${correctnessLabel(q.correctness)}</div>
    </div>

    ${rubricBar(q.rubric_scores)}
    ${stepsBreakdown(q.steps_analysis)}

    ${q.student_answer ? `
    <details class="answer-toggle" open>
      <summary>Student's Written Answer</summary>
      <div class="student-answer"><b>Student wrote</b>${formatMathText(q.student_answer)}</div>
    </details>` : ""}

    <div class="two-col">
      <div>
        <div class="col-title good">Strengths</div>
        <ul class="pt-list">${strengths}</ul>
      </div>
      <div>
        <div class="col-title bad">To improve</div>
        <ul class="pt-list">${improvements}</ul>
      </div>
    </div>

    ${q.overall_feedback ? `<div class="feedback-line">${formatMathText(q.overall_feedback)}</div>` : ''}
  </div>`;
}

    <section>
      <div class="section-title">Multiple Choice Questions <span class="tally">${mcq.filter(m => m.is_correct).length}/${mcq.length} correct</span></div>
      <div class="mcq-grid">${mcqCells(mcq)}</div>
    </section>` : ""}

    ${subs.length ? `
    <section>
      <div class="section-title">Written Answers <span class="tally">${subSummary.total_awarded_marks ?? ""}/${subSummary.total_max_marks ?? ""} marks</span></div>
      ${subs.map(q => questionCard(q)).join("")}
    </section>` : ""}

    <footer>Report generated automatically from evaluation data • Powered by Gradified</footer>
  `;

  document.getElementById("sheet").innerHTML = html;
  
  // Render LaTeX math expressions with KaTeX
  setTimeout(renderAllMath, 50);
}

/* ============================================================
   MODAL & USER INTERACTION LOGIC
   ============================================================ */
function openJsonModal() {
  const modal = document.getElementById("jsonModal");
  const textarea = document.getElementById("jsonTextArea");
  document.getElementById("jsonError").style.display = "none";
  
  if (currentReportData) {
    textarea.value = JSON.stringify(currentReportData, null, 2);
  } else {
    textarea.value = JSON.stringify(DEMO_REPORT_DATA, null, 2);
  }
  
  modal.classList.add("active");
  textarea.focus();
}

function closeJsonModal() {
  document.getElementById("jsonModal").classList.remove("active");
}

function handleModalBackdropClick(e) {
  if (e.target.id === "jsonModal") closeJsonModal();
}

function applyJsonFromModal() {
  const textarea = document.getElementById("jsonTextArea");
  const errBanner = document.getElementById("jsonError");
  errBanner.style.display = "none";

  try {
    const parsed = parseReportJSON(textarea.value);
    renderReport(parsed);
    saveToLocalStorage(parsed);
    updateStatusTag("Custom JSON Loaded");
    closeJsonModal();
    showToast("Report updated successfully!");
  } catch (err) {
    errBanner.textContent = "Error: " + err.message;
    errBanner.style.display = "block";
  }
}

function loadSampleIntoModal() {
  document.getElementById("jsonTextArea").value = JSON.stringify(DEMO_REPORT_DATA, null, 2);
  document.getElementById("jsonError").style.display = "none";
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const parsed = parseReportJSON(e.target.result);
      renderReport(parsed);
      saveToLocalStorage(parsed);
      updateStatusTag(`File: ${file.name}`);
      showToast(`Loaded ${file.name}!`);
    } catch (err) {
      alert("Could not load file: " + err.message);
    }
  };
  reader.readAsText(file);
}

function updateStatusTag(text) {
  document.getElementById("statusText").textContent = text;
}

function saveToLocalStorage(data) {
  try {
    localStorage.setItem("GRADIFIED_MATH_SAVED_REPORT", JSON.stringify(data));
  } catch (e) {
    console.warn("Could not save to localStorage", e);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem("GRADIFIED_MATH_SAVED_REPORT");
    if (saved) {
      const parsed = JSON.parse(saved);
      renderReport(parsed);
      updateStatusTag("Saved Local Report");
      return true;
    }
  } catch (e) {
    console.warn("Could not load from localStorage", e);
  }
  return false;
}

/* ============================================================
   EXTERNAL PROGRAMMATIC LOADING (URL, PostMessage, Window Call)
   ============================================================ */
window.loadReportData = function(jsonOrObj) {
  try {
    const parsed = typeof jsonOrObj === 'string' ? parseReportJSON(jsonOrObj) : jsonOrObj;
    renderReport(parsed);
    saveToLocalStorage(parsed);
    updateStatusTag("Programmatically Loaded");
    showToast("Report loaded via application!");
  } catch (err) {
    console.error("Failed to load report data:", err);
  }
};

window.addEventListener("message", function(event) {
  if (event.data && (event.data.type === "LOAD_REPORT_DATA" || event.data.REPORT_DATA)) {
    const payload = event.data.REPORT_DATA || event.data.data;
    if (payload) window.loadReportData(payload);
  }
});

window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    const file = e.dataTransfer.files[0];
    if (file.name.endsWith(".json") || file.name.endsWith(".txt")) {
      const reader = new FileReader();
      reader.onload = ev => window.loadReportData(ev.target.result);
      reader.readAsText(file);
    }
  }
});

function triggerFileInput() {
  document.getElementById("fileInput").click();
}

let currentReportId = null;

function getReportFilename(isMath) {
  let id = currentReportId;
  if (!id) {
    const urlParams = new URLSearchParams(window.location.search);
    const hashRaw = window.location.hash ? window.location.hash.replace(/^#+/, '').replace(/^\/+/, '').replace(/^\?+/, '') : "";
    const hashParams = new URLSearchParams(hashRaw);
    id = urlParams.get("id") || urlParams.get("reportId") || hashParams.get("id") || hashParams.get("reportId");
    if (!id && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(hashRaw)) {
      id = hashRaw;
    }
  }

  if (id) {
    id = String(id).trim();
    return isMath ? `math-${id}.pdf` : `theory-${id}.pdf`;
  }
  return isMath ? `math-report.pdf` : `theory-report.pdf`;
}

function downloadPDF() {
  const element = document.getElementById("sheet");
  if (!element) return;

  // Auto-expand all student answer details before PDF export
  document.querySelectorAll("details.answer-toggle").forEach(el => {
    el.open = true;
  });

  const filename = getReportFilename(true);
  showToast("Generating PDF download...");

  if (typeof html2pdf === "function") {
    const opt = {
      margin: [10, 10, 10, 10],
      filename: filename,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    html2pdf().set(opt).from(element).save().then(() => {
      showToast(`Downloaded ${filename}!`);
    }).catch(err => {
      console.warn("html2pdf error, falling back to print:", err);
      window.print();
    });
  } else {
    window.print();
  }
}

/* Helper for fetching report by ID */
function fetchReportById(reportId, apiHostOverride) {
  if (!reportId || !reportId.trim()) return;
  const idClean = reportId.trim();
  currentReportId = idClean;

  const urlParams = new URLSearchParams(window.location.search);
  const apiHost = apiHostOverride || urlParams.get("apiHost") || "https://api.gradified.in";
  const apiUrl = `${apiHost}/api/v1/report/${encodeURIComponent(idClean)}`;
  
  updateStatusTag(`Loading Report #${idClean.substring(0,8)}...`);
  
  fetch(apiUrl)
    .then(res => {
      if (!res.ok) throw new Error("API returned HTTP status " + res.status);
      return res.json();
    })
    .then(data => {
      window.loadReportData(data);
      updateStatusTag(`Report #${idClean.substring(0,8)}`);
      showToast("Report loaded!");
    })
    .catch(err => {
      console.error("Error fetching report ID:", err);
      updateStatusTag("Fetch error");
      alert("Could not load report ID " + idClean + ": " + err.message);
    });
}

/* ============================================================
   INIT ON PAGE LOAD & PARAMETER PARSING
   ============================================================ */
function decodeBase64Utf8(str) {
  try {
    const bytes = Uint8Array.from(atob(str), c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  } catch (e) {
    return atob(str);
  }
}

function processUrlParameters() {
  const urlParams = new URLSearchParams(window.location.search);
  const hashRaw = window.location.hash ? window.location.hash.replace(/^#+/, '').replace(/^\/+/, '').replace(/^\?+/, '') : "";
  const hashParams = new URLSearchParams(hashRaw);

  const b64Param = urlParams.get("b64") || urlParams.get("base64") || hashParams.get("b64") || hashParams.get("base64");
  const dataParam = urlParams.get("data") || urlParams.get("json") || hashParams.get("data") || hashParams.get("json");
  const fetchUrlParam = urlParams.get("url") || urlParams.get("src") || urlParams.get("fetch") || hashParams.get("url");
  
  let reportIdParam = urlParams.get("id") || urlParams.get("reportId") || hashParams.get("id") || hashParams.get("reportId");

  // Handle direct UUID in hash e.g. #02af9b4e-b19d-4b3d-9fda-e52609fc2330
  if (!reportIdParam && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(hashRaw)) {
    reportIdParam = hashRaw;
  }

  const tokenParam = urlParams.get("token") || urlParams.get("auth") || urlParams.get("bearer");
  const fetchHeaders = {};
  if (tokenParam) {
    fetchHeaders["Authorization"] = tokenParam.startsWith("Bearer ") ? tokenParam : `Bearer ${tokenParam}`;
  }

  // Option A: Report ID parameter
  if (reportIdParam) {
    fetchReportById(reportIdParam);
    return true;
  }

  // Option B: Remote API fetch URL
  if (fetchUrlParam) {
    updateStatusTag("Fetching report from API...");
    fetch(fetchUrlParam, { headers: fetchHeaders })
      .then(res => {
        if (!res.ok) throw new Error("HTTP status " + res.status);
        return res.json();
      })
      .then(data => {
        window.loadReportData(data);
        showToast("Loaded from URL!");
      })
      .catch(err => {
        console.error("Error fetching report URL:", err);
        updateStatusTag("Fetch error");
        alert("Could not load report from API: " + err.message);
      });
    return true;
  }

  // Option C: Base64 string in URL
  if (b64Param) {
    try {
      const decodedJson = decodeBase64Utf8(decodeURIComponent(b64Param));
      window.loadReportData(decodedJson);
      return true;
    } catch(e) {
      console.error("Failed to parse Base64 URL param", e);
    }
  }

  // Option D: Plain or URL-encoded JSON in URL
  if (dataParam) {
    try {
      const decoded = decodeURIComponent(dataParam);
      window.loadReportData(decoded);
      return true;
    } catch(e) {
      console.error("Failed to parse JSON URL param", e);
    }
  }

  return false;
}

window.addEventListener("hashchange", () => {
  processUrlParameters();
});

window.addEventListener("DOMContentLoaded", () => {
  if (window.opener) {
    try {
      window.opener.postMessage({ type: "REPORT_VIEWER_READY" }, "*");
    } catch(e) {}
  }

  window.addEventListener("beforeprint", () => {
    document.querySelectorAll("details.answer-toggle").forEach(el => {
      el.open = true;
    });
  });

  if (!processUrlParameters()) {
    if (!loadFromLocalStorage()) {
      renderReport(DEMO_REPORT_DATA);
    }
  }
});
</script>
