<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mathematics Assessment Report — Powered by Gradified</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../logo_g.png">
<link rel="shortcut icon" type="image/png" href="../logo_g.png">
<link rel="apple-touch-icon" href="../logo_g.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- KaTeX CSS & JS for LaTeX Rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<!-- html2pdf.js for direct PDF export with custom filenames -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
  :root {
    --ink: #1b2431;
    --ink-soft: #4a5568;
    --paper: #f7f5f0;
    --card: #ffffff;
    --line: #dfdad0;
    --navy: #1f3550;
    --navy-deep: #132234;
    --gold: #b8862f;
    --gold-soft: #f1e3c4;
    --good: #2f6b4f;
    --good-bg: #e7f1ea;
    --mid: #9a6b1c;
    --mid-bg: #faf1de;
    --bad: #9c3b3b;
    --bad-bg: #f7e9e9;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14.5px;
    line-height: 1.55;
    overflow-x: hidden;
  }

  /* ---------- Top Action Toolbar / Navbar ---------- */
  .toolbar-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    transition: all 0.2s ease;
  }
  .toolbar {
    max-width: 880px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .toolbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .data-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    background: rgba(247, 245, 240, 0.8);
    border: 1px solid var(--line);
    border-radius: 30px;
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    animation: statusPulse 2s infinite ease-in-out;
  }
  @keyframes statusPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.75; }
  }
  .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    background: var(--navy);
    color: #ffffff;
    border: 1px solid var(--navy-deep);
    box-shadow: 0 2px 6px rgba(31, 53, 80, 0.15);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-print:hover {
    background: var(--navy-deep);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(19, 34, 52, 0.25);
  }
  .btn-print:active {
    transform: translateY(0);
  }
  .btn-print svg {
    width: 15px;
    height: 15px;
    fill: currentColor;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }
  .btn-primary {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }
  .btn-primary:hover {
    background: var(--navy-deep);
    border-color: var(--navy-deep);
  }
  .btn-accent {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  /* ---------- Sheet Container ---------- */
  .sheet {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 48px 80px;
  }

  /* ---------- Header / Branding ---------- */
  .masthead {
    border-bottom: 3px solid var(--navy);
    padding-bottom: 20px;
    margin-bottom: 28px;
  }
  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--line);
  }
  .brand-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-logo {
    height: 42px;
    width: auto;
    object-fit: contain;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .powered-by {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    font-weight: 600;
  }
  .brand-name {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy-deep);
    letter-spacing: -0.01em;
  }
  .masthead-main {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .masthead h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0;
    color: var(--navy-deep);
  }
  .masthead .meta {
    text-align: right;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .masthead .meta div { margin-bottom: 2px; }

  /* ---------- Score dial + summary ---------- */
  .summary-row {
    display: flex;
    gap: 28px;
    align-items: center;
    margin-bottom: 32px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  .dial-wrap {
    position: relative;
    width: 112px;
    height: 112px;
    flex: 0 0 auto;
  }
  .dial-wrap svg { transform: rotate(-90deg); }
  .dial-pct {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .dial-pct b { font-family: 'Source Serif 4', serif; font-size: 26px; color: var(--navy-deep); }
  .dial-pct span { font-size: 10px; color: var(--ink-soft); letter-spacing: .05em; text-transform: uppercase; }
  .stat-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }
  .stat {
    border-left: 1px solid var(--line);
    padding: 2px 20px;
  }
  .stat:first-child { border-left: none; padding-left: 0; }
  .stat .num { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 600; color: var(--navy); }
  .stat .lbl { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }

  /* ---------- Teacher's note ---------- */
  .note {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 4px;
    padding: 20px 24px;
    margin-bottom: 34px;
  }
  .note .eyebrow { margin-bottom: 8px; }
  .note p { margin: 0 0 10px; color: var(--ink); }
  .note p:last-child { margin-bottom: 0; }

  /* ---------- Section headers ---------- */
  .section-title {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--navy-deep);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .section-title .tally {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
  }
  section { margin-bottom: 36px; }

  /* ---------- MCQ grid ---------- */
  .mcq-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .mcq-cell {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 12.5px;
  }
  .mcq-cell .q {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink-soft);
    font-size: 11px;
  }
  .mcq-cell .opt { font-weight: 600; margin-top: 2px; }
  .mcq-cell.correct { border-left: 3px solid var(--good); }
  .mcq-cell.correct .opt { color: var(--good); }
  .mcq-cell.wrong { border-left: 3px solid var(--bad); }
  .mcq-cell.wrong .opt { color: var(--bad); }
  .mcq-cell .given { font-size: 11px; color: var(--ink-soft); font-weight: 400; }

  /* ---------- Question cards ---------- */
  .qcard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 22px 20px;
    margin-bottom: 16px;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .qcard-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }
  .qcard-head h3 {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--ink);
    line-height: 1.4;
  }
  .qcard-head .qid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gold);
    margin-bottom: 2px;
    display: block;
  }
  .marks-badge {
    flex: 0 0 auto;
    text-align: center;
    padding: 5px 12px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
  }
  .marks-badge.correct { background: var(--good-bg); color: var(--good); }
  .marks-badge.partially_correct { background: var(--mid-bg); color: var(--mid); }
  .marks-badge.incorrect { background: var(--bad-bg); color: var(--bad); }

  .qcard-badges {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    flex: 0 0 auto;
  }
  .confidence-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
    white-space: nowrap;
  }
  .confidence-badge b { font-weight: 700; }
  .confidence-badge.high { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .confidence-badge.medium { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .confidence-badge.low { background: #fff1f2; color: #be123c; border-color: #fecdd3; }

  .mcq-conf {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    margin-top: 4px;
    padding: 1px 4px;
    border-radius: 3px;
    display: inline-block;
  }
  .mcq-conf.high { background: #ecfdf5; color: #047857; }
  .mcq-conf.medium { background: #fffbeb; color: #b45309; }
  .mcq-conf.low { background: #fff1f2; color: #be123c; }

  .rubric-bar {
    display: flex;
    height: 9px;
    border-radius: 5px;
    overflow: hidden;
    background: var(--line);
    margin-bottom: 6px;
  }
  .rubric-bar .seg { height: 100%; }
  .rubric-bar .seg.hit { background: var(--good); }
  .rubric-bar .seg.miss { background: var(--bad-bg); }
  .rubric-labels {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .rubric-labels span b { color: var(--ink); }

  /* ---------- Step-by-Step Analysis ---------- */
  .steps-container {
    margin-bottom: 14px;
    background: #fcfbfa;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .steps-container .steps-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 8px;
  }
  .step-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .step-row:last-child { margin-bottom: 0; }
  .step-badge {
    font-size: 11px;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .step-badge.hit { background: var(--good-bg); color: var(--good); }
  .step-badge.miss { background: var(--bad-bg); color: var(--bad); }
  .step-text { flex: 1; color: var(--ink); }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 12px;
  }
  .col-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .col-title.good { color: var(--good); }
  .col-title.bad { color: var(--bad); }
  ul.pt-list { margin: 0; padding-left: 16px; }
  ul.pt-list li { margin-bottom: 3px; }

  .feedback-line {
    font-size: 13px;
    color: var(--ink-soft);
    font-style: italic;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 4px;
  }

  .student-answer {
    background: #fbfaf7;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 12px;
    white-space: pre-wrap;
  }
  .student-answer b { color: var(--ink); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }

  details.answer-toggle summary {
    cursor: pointer;
    font-size: 11.5px;
    color: var(--navy);
    font-weight: 600;
    margin-bottom: 8px;
    list-style: none;
  }
  details.answer-toggle summary::-webkit-details-marker { display: none; }
  details.answer-toggle summary::before { content: "▸ "; }
  details.answer-toggle[open] summary::before { content: "▾ "; }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  /* ---------- Modal Dialog ---------- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(19, 34, 52, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    padding: 20px;
  }
  .modal-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    background: #ffffff;
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    transform: translateY(12px);
    transition: transform 0.2s ease;
  }
  .modal-backdrop.active .modal-content {
    transform: translateY(0);
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 {
    margin: 0;
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    color: var(--navy-deep);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 24px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
  .modal-close:hover { color: var(--navy-deep); }
  .modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    flex: 1;
  }
  .modal-body p {
    margin: 0 0 12px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .json-textarea {
    width: 100%;
    height: 280px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.45;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fbfaf7;
    color: #1e293b;
    resize: vertical;
  }
  .json-textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .error-banner {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--bad-bg);
    border: 1px solid #f87171;
    border-radius: 6px;
    color: var(--bad);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    white-space: pre-wrap;
  }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: #fdfbf7;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }
  .modal-footer-right {
    display: flex;
    gap: 10px;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy-deep);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    z-index: 2000;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  /* KaTeX Customizations */
  .katex-display { margin: 0.5em 0; }

  /* ---------- Responsive Design ---------- */
  @media (max-width: 768px) {
    .sheet {
      padding: 24px 18px 60px;
    }
    .toolbar {
      padding: 10px 16px;
    }
    .masthead-top {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .masthead .meta {
      text-align: left;
    }
    .masthead-main {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .masthead h1 {
      font-size: 26px;
    }
    .summary-row {
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 24px;
    }
    .stat-grid {
      width: 100%;
    }
    .stat {
      padding: 2px 10px;
      text-align: center;
    }
    .mcq-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .two-col {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .qcard {
      padding: 16px 16px 18px;
    }
    .qcard-head {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .marks-badge {
      align-self: flex-start;
    }
    .section-title {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }
    .modal-content {
      max-height: 95vh;
    }
    .modal-header, .modal-body, .modal-footer {
      padding: 14px 16px;
    }
    .modal-footer {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .modal-footer-right {
      justify-content: flex-end;
    }
    .toast {
      bottom: 16px;
      right: 16px;
      left: 16px;
      text-align: center;
    }
  }

  @media (max-width: 480px) {
    .sheet {
      padding: 16px 12px 40px;
    }
    .masthead h1 {
      font-size: 22px;
    }
    .mcq-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .stat-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .stat {

<!-- Top Navigation / Action Bar -->
<div class="toolbar-wrapper">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="data-status-tag" id="statusTag">
        <span class="status-dot"></span>
        <span id="statusText">Mathematics Assessment</span>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="btn-print" onclick="downloadPDF()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <span>Download PDF</span>
      </button>
    </div>
  </div>
</div>

<!-- Hidden File Input -->
<input type="file" id="fileInput" accept=".json,application/json,.txt" style="display:none;" onchange="handleFileUpload(event)">

<!-- Main Sheet Container -->
<div class="sheet" id="sheet">
  <!-- Rendered dynamically by JavaScript -->
</div>

<!-- Paste JSON Modal -->
<div class="modal-backdrop" id="jsonModal" onclick="handleModalBackdropClick(event)">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Paste Mathematics Evaluation JSON Data</h3>
      <button class="modal-close" onclick="closeJsonModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>Paste evaluation report JSON or JavaScript object below to render report view for any student/user. You can also drag and drop a <code>.json</code> file into this box.</p>
      <textarea id="jsonTextArea" class="json-textarea" placeholder="Paste your REPORT_DATA JSON object here..."></textarea>
      <div id="jsonError" class="error-banner"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="loadSampleIntoModal()">Load Sample JSON</button>
      <div class="modal-footer-right">
        <button class="btn" onclick="closeJsonModal()">Cancel</button>
        <button class="btn btn-accent" onclick="applyJsonFromModal()">Render Report</button>
      </div>
    </div>
  </div>
</div>
